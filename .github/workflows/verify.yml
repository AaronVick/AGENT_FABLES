name: verify-agent-fables

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Rebuild and verify all agent routes
        run: npm run check
      - name: Enforce local agent metrics
        run: npm run metrics
      - name: Show publication blockers without failing local verification
        run: npm run launch-audit
