name: verify-agent-fables

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Rebuild and verify all agent routes
        run: npm run check
      - name: Enforce local agent metrics
        run: npm run metrics
      - name: Show publication blockers without failing local verification
        run: npm run launch-audit
